{% extends 'base.html' %}
{% load static %}

{% block title %}Blast Search - Asteraceae Platform{% endblock %}

{% block extra_css %}
    <link href="{% static 'vendor/css/jquery.dataTables.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/slick-theme.css' %}"/>
    <link href="{% static 'css/font-awesome.min.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/style.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/responsive.css' %}" rel="stylesheet"/>

    <style>
        /* 1. Force container width */
        @media (min-width: 1200px) {
            .container { max-width: 1320px !important; }
        }

        /* 2. Main Content Card */
        .content-box-wrapper {
            background-color: #ffffff;
            border: 1px solid #eaeff2;
            border-radius: 16px;
            padding: 45px 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            margin-top: 20px;
            margin-bottom: 50px;
        }

        /* 3. Title Styling */
        .section-title {
            font-family: "Georgia", "Times New Roman", serif;
            font-weight: 700;
            color: #d35400;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            position: relative;
            display: inline-block;
        }

        .section-subtitle {
            font-family: "Arial", sans-serif;
            color: #7f8c8d;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0;
            text-align: center;
        }

        .section-divider {
            margin: 1.5rem auto 2.5rem auto;
            border: 0;
            border-top: 1px solid #e0e0e0;
            width: 100%;
        }

        /* 4. Form Styling */
        .custom-form-card {
            background: #fff;
            border: 1px solid #f0e6d2;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .form-label-fancy {
            font-weight: 700;
            color: #444;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            justify-content: space-between; /* To push example link to right if needed */
        }
        
        .label-text::before {
            content: "★";
            color: #e67e22;
            margin-right: 8px;
            font-size: 0.8rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: #e67e22;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.1);
        }

        /* 5. Button Styling */
        .btn-search-gradient {
            padding: 12px 50px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
            border: none;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(211, 84, 0, 0.3);
            transition: all 0.3s ease;
        }

        .btn-search-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(211, 84, 0, 0.4);
            color: white;
        }

        /* Helper for links */
        .text-link-orange {
            color: #d35400;
            text-decoration: underline;
            font-weight: 500;
        }
        .text-link-orange:hover {
            color: #e67e22;
        }
        
        .download-badge {
            font-size: 0.8rem;
            background-color: #fff5eb;
            color: #d35400;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid #ffe8d6;
            text-decoration: none;
            margin-left: 10px;
        }
        .download-badge:hover {
            background-color: #e67e22;
            color: white;
        }
    </style>
{% endblock %}

{% block content %}
    <iframe src="https://gsds.gao-lab.org/index.php" style="height: 750px;width: 100%"></iframe>

{% endblock %}

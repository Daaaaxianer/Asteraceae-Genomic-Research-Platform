{% extends 'base.html' %}
{% load static %}

{% block title %}Bi-visualization - Asteraceae Platform{% endblock %}

{% block extra_css %}
    <link href="{% static 'vendor/css/jquery.dataTables.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/slick-theme.css' %}"/>
    <link href="{% static 'css/font-awesome.min.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/style.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/responsive.css' %}" rel="stylesheet"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
         
        @media (min-width: 1200px) {
            .container {
                max-width: 1320px !important;
            }
        }

         
        .content-box-wrapper {
            background-color: #ffffff;
            border: 1px solid #eaeff2;
            border-radius: 16px;
            padding: 45px 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            margin-top: 20px;
            margin-bottom: 50px;
             
            overflow: hidden; 
        }

         
        .section-title {
            font-family: "Georgia", "Times New Roman", serif;
            font-weight: 700;
            color: #d35400;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            position: relative;
            display: inline-block;
        }

        .section-subtitle {
            font-family: "Arial", sans-serif;
            color: #7f8c8d;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0;
            text-align: center;
        }

        .section-divider {
            margin: 1.5rem auto 2.5rem auto;
            border: 0;
            border-top: 1px solid #e0e0e0;
            width: 100%;
            opacity: 1;
        }
    </style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="content-box-wrapper">

        <div class="text-center">
            <h2 class="section-title">Bi-visualization</h2>
            <p class="section-subtitle">Sequence alignment and visualization</p>
        </div>

        <hr class="section-divider">

        <div class="row justify-content-center">
            <div class="col-12">
                <iframe src="/tools/sequenceserver-app/" 
                        style="width: 100%; height: 1200px; border: 0; display: block;" 
                        title="SequenceServer">
                </iframe>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block extra_js %}
    {% endblock %}

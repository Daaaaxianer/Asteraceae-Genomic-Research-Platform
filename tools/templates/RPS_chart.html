{% extends 'index.html' %}


{% block body_index %}
<div style="max-width: 900px; margin: 0 auto; padding: 15px; background-color: rgba(255, 255, 255, 0.75); border-radius: 10px;">
    <h2 class="text-center">Regulatory proteins</h2>
</div>
</header>
    <div class="container"  style="padding-bottom: 82px; padding-top: 30px">

    <div id="plot" style="width:100%;height:100%;"></div>
    <script src="../../static/js/plotly-latest.min.js"></script>
    <script>
    var data = [{
        "labels": ["TFs","PKs","TRs"],
        "values": [132336,99239,30407],
        "type": "pie",
        "marker": {"colors": ['#B2BEC3', '#8395A7', '#DADFE1']}
    }];

    var layout = {
        "showlegend": false,
        "hole": 1,
        "title": {"text": "Regulatory proteins"},
        "annotations": [{"font": {"size": 1}, "showarrow": false, "text": "", "x": 0, "y": 0}]
    };

    var plot = document.getElementById("plot");
    Plotly.newPlot(plot, data, layout);


    plot.on('plotly_click', function(data) {
        window.location.href = "{% url "TF_genes_index_url" %}";
    });
    </script>
</div>
{% endblock %}

    // 初始化热图
    function createHeatmap() {
        const container = document.getElementById('heatmap');
        const width = container.clientWidth;
        const height = Math.min(width * 0.7, window.innerHeight * 0.7);

        const heatmapData = {
            z: data,
            x: families,
            y: species,
            type: 'heatmap',
            colorscale: document.getElementById('colorscale').value,
            hoverongaps: false
        };

        const layout = {
                // xaxis: {
                //     title: '基因家族',
                //     tickangle: -45,
                //     showline: false,
                //     showgrid: false,
                //     zeroline: false
                // },
                // yaxis: {
                //     title: '物种',
                //     automargin: true,
                //     showline: false,
                //     showgrid: false,
                //     zeroline: false
                // },
                margin: {
                    l: 150,
                    r: 50,
                    b: 150,
                    t: 50,
                    pad: 4
                },
                width: width,
                height: height,
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)'
            };

        Plotly.newPlot('heatmap', [heatmapData], layout, {displayModeBar: true})
            .then(function(gd) {
                gd.on('plotly_click', function(data) {
                    if(data.points && data.points.length > 0) {
                        const point = data.points[0];
                        const url = "{% url 'TF_genes_index_url' %}?species=" +
                                    encodeURIComponent(point.y) + "&family=" +
                                    encodeURIComponent(point.x);
                        window.location.href = url;
                    }
                });
            });
    }

    // 更新颜色方案
    function updateColorscale() {
        Plotly.restyle('heatmap', {
            colorscale: document.getElementById('colorscale').value
        });
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
        createHeatmap();

        // 响应窗口大小变化
        window.addEventListener('resize', function() {
            Plotly.relayout('heatmap', {
                width: document.getElementById('heatmap').clientWidth,
                height: Math.min(document.getElementById('heatmap').clientWidth * 0.7,
                          window.innerHeight * 0.7)
            });
        });
    });
</script>

{% extends 'Browse_index.html' %}


{% block head_link %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteraceae platform</title>
    <link href="../../static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../static/vendor/css/modern-business.css" rel="stylesheet">
    <link rel="icon" href="../../static/image/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="../../static/vendor/css/home.css" type="text/css">
    <script src="../../static/js/jquery-3.5.1.js"></script>
    <script src="../../static/js/jquery.dataTables.min.js"></script>
    <link href="../../static/css/jquery.dataTables.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/slick-theme.css"/>
    <link href="../../static/css/font-awesome.min.css" rel="stylesheet"/>
    <link href="../../static/css/style.css" rel="stylesheet"/>
    <link href="../../static/css/responsive.css" rel="stylesheet"/>
    <link href="../../static/vendor/css/style.css" rel="stylesheet">
{% endblock %}

{% block body_index %}
    <div class="container">
        <div class="row">
            <div class="col-lg-6">
                <button id="downloadBtn" class="btn btn-primary">Download Image</button>
            </div>
            <div class="col-lg-12">
                <img id="plotImage" class="col-lg-12" src="/static/genefam.png" alt="Gene Family Plot">
            </div>
        </div>
    </div>

<script>
    document.getElementById("downloadBtn").addEventListener("click", function() {
        var link = document.createElement("a");
        link.href = document.getElementById("plotImage").src;
        link.download = "genefam.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>
{% endblock %}




{% block list_js %}
    <script src="../../static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
{% endblock %}

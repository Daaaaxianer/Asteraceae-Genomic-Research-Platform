[uwsgi]
env = PYTHONNOUSERSITE=1
#项目目录
chdir=/wangjp/Asteraceae/Asteraceae

#指定项目application
wsgi-file=/wangjp/Asteraceae/Asteraceae/LGBP/wsgi.py

#python 程序内用以启动的application 变量名
callable=application

# 进程个数
processes=4

# 线程个数
threads=2

#指定启动时的pid文件路径（用于停止服务和重启服务，请勿删除）
pidfile=/wangjp/Asteraceae/Asteraceae/uwsgi.pid

# 指定ip及端口
# 默认http模式，可切换至socket模式
http=0.0.0.0:8457
#socket=0.0.0.0:8457

#启动uwsgi的用户名和用户组
uid=wanglab
gid=wanglab

#启用主进程
master=true

# 设置缓冲区大小
buffer-size = 32768

# 后台运行,并输出日志
daemonize = /www/wwwlogs/python/Asteraceae/uwsgi.log

# 环境变量配置
env = PATH=/wangjp/yuzijian/tools/ncbi-blast-2.15.0+/bin/:/www/tools/soft_tools/diamond:%(ENV_PATH)

# 自定义设置项请写到该处, 
# 如果项目的启动方式您不想使用 wsgi-file 请注释掉,但不要删除，通讯方式(http, socket)同理;
# 最好以上面相同的格式 <注释 + 换行 + key = value> 进行书写，方便以后查阅

# Keep URL query secrets out of request logs.
log-format = [%(ctime)] %(addr) %(method) %(var.PATH_INFO) => %(status) %(rsize) bytes %(msecs) ms
